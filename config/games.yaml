games:
  - id: elden-ring
    rawg_id: 326243
    nom: "Elden Ring"
    plateformes: [PS5, PS4, Xbox Series, Xbox One, PC]
    # Domaine + préfixe de chemin supportés par Tavily includeDomains : permet de cibler
    # la section française/du jeu d'un site, pas seulement le domaine entier
    sources:
      - "reddit.com/r/Eldenring"
      - "eldenring.wiki.fextralife.com"
    # Fichier de config/glossaires/ : paires EN->FR officielles extraites du jeu.
    # Sa présence activera le pipeline "sources EN + traduction" (jeu sans glossaire = flux actuel)
    glossaire: "elden-ring.json"
    statut: actif

  - id: skyrim
    rawg_id: 5679
    nom: "The Elder Scrolls V: Skyrim"
    plateformes: [PS5, PS4, Xbox Series, Xbox One, PC, Switch]
    # Sources anglaises (plus fiables que les wikis FR) : le préfixe "Skyrim:" d'UESP exclut les autres jeux de la série
    sources:
      - "en.uesp.net/wiki/Skyrim:"
      - "reddit.com/r/skyrim"
    # Paires EN->FR extraites des fichiers de langue officiels (jeu de base + DLC)
    glossaire: "skyrim.json"
    statut: actif